services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: monitor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U monitor -d monitor']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: ['api']
    environment:
      SERVER_MONITOR_TOKEN: ${SERVER_MONITOR_TOKEN:?set SERVER_MONITOR_TOKEN in .env}
      SERVER_MONITOR_STORAGE: postgres
      PG_URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor
      SERVER_MONITOR_ALLOW_PRIVATE_TARGETS: ${SERVER_MONITOR_ALLOW_PRIVATE_TARGETS:-false}
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    command: ['worker']
    environment:
      SERVER_MONITOR_STORAGE: postgres
      PG_URL: postgres://monitor:${POSTGRES_PASSWORD}@postgres:5432/monitor
      SERVER_MONITOR_ALLOW_PRIVATE_TARGETS: ${SERVER_MONITOR_ALLOW_PRIVATE_TARGETS:-false}
      SERVER_MONITOR_RETENTION_DAYS: ${SERVER_MONITOR_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
